name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/${{ matrix.target }}/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Set binary name
        id: binary
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            echo "name=gh_copilot_pricing_tui.exe" >> "$GITHUB_OUTPUT"
          else
            echo "name=gh_copilot_pricing_tui" >> "$GITHUB_OUTPUT"
          fi

      - name: Package binary (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME:-${{ inputs.tag }}}
          ASSET_NAME="gh-llm-cost-table-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${ASSET_NAME}"
          cp "target/${{ matrix.target }}/release/${{ steps.binary.outputs.name }}" "dist/${ASSET_NAME}/"
          cp README.md LICENSE "dist/${ASSET_NAME}/"
          cd dist
          tar -czf "${ASSET_NAME}.tar.gz" "${ASSET_NAME}"
          echo "asset=${ASSET_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ inputs.tag }}" }
          $AssetName = "gh-llm-cost-table-$Version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist\$AssetName" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ steps.binary.outputs.name }}" "dist\$AssetName\"
          Copy-Item README.md LICENSE "dist\$AssetName\"
          Compress-Archive -Path "dist\$AssetName" -DestinationPath "dist\$AssetName.zip" -Force
          "asset=$AssetName.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.asset }}
          path: dist/${{ env.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Release ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: dist/*
